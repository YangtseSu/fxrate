[package]
name = "fxrate"
version = "0.5.1"
edition = "2021"
description = "Offline currency conversion CLI backed by Frankfurter or exchange-api rates"
license = "GPL-3.0-only"
repository = "https://github.com/YangtseSu/fxrate"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
textplots = "0.8"
owo-colors = "4"
terminal_size = "0.4"
iso_currency = "0.7"
indicatif = "0.18.6"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
