[package]
name = "huobi"
version = "0.3.0"
edition = "2021"
description = "Offline currency conversion CLI backed by Frankfurter or exchange-api rates"
license = "GPL-3.0-only"
repository = "https://github.com/YangtseSu/huobi"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "ab_glyph", "line_series", "point_series"] }
viuer = { version = "0.11", default-features = false, features = ["icy_sixel"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
