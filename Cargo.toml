[package]
name = "fxrate"
version = "0.5.2"
edition = "2021"
description = "Offline currency conversion CLI backed by Frankfurter or exchange-api rates"
license = "GPL-3.0-only"
repository = "https://github.com/YangtseSu/fxrate"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = "0.40"
csv = "1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
textplots = "0.8"
owo-colors = "4"
unicode-width = "0.2"
terminal_size = "0.4"
iso_currency = "0.7"
indicatif = "0.18"

[dev-dependencies]
rusqlite = "0.40"
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
